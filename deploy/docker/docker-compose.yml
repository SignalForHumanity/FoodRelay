version: "3.9"

services:
  registry:
    build:
      context: ../..
      dockerfile: deploy/docker/registry.Dockerfile
    ports:
      - "8081:8081"
    environment:
      REGISTRY_ADDR: ":8081"
      REGISTRY_DB_PATH: "/data/registry.db"
    volumes:
      - registry-data:/data
    restart: unless-stopped

  node:
    build:
      context: ../..
      dockerfile: deploy/docker/node.Dockerfile
    ports:
      - "8080:8080"
    environment:
      NODE_ID: "node-local-01"
      NODE_PHONE: "${NODE_PHONE}"
      NODE_ADDR: ":8080"
      NODE_DB_PATH: "/data/node.db"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN}"
      TWILIO_FROM_PHONE: "${TWILIO_FROM_PHONE}"
      REGISTRY_URL: "http://registry:8081"
      NODE_PRIVATE_KEY_HEX: "${NODE_PRIVATE_KEY_HEX}"
      ADMIN_PHONES: "${ADMIN_PHONES}"
    volumes:
      - node-data:/data
    depends_on:
      - registry
    restart: unless-stopped

volumes:
  registry-data:
  node-data:
